<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<title>INGESIR · Ventas</title>
<style>
:root{
  --bg:#f3f5f8; --panel:#fff; --ink:#16202c; --muted:#64748b; --line:#e2e8f0; --soft:#f8fafc;
  --brand:#1e3a5f; --brand2:#2b5288; --accent:#f08a1c; --danger:#dc2626; --ok:#16a34a; --warn:#d97706;
  --r:12px; --sh:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand2)}
.hidden{display:none!important}

/* ---------- topbar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.3px}
.brand img{height:30px;background:#fff;border-radius:6px;padding:2px}
.brand small{font-weight:500;opacity:.75}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0}
.nav button{background:transparent;border:0;color:#cfdcec;padding:8px 12px;border-radius:8px;white-space:nowrap;font-weight:600}
.nav button.on{background:rgba(255,255,255,.14);color:#fff}
.nav .badge{background:var(--danger);color:#fff;border-radius:99px;padding:0 6px;font-size:11px;margin-left:4px}
.userchip{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:99px;padding:6px 12px;font-weight:600}
.btn-new{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.demo-flag{background:#fde68a;color:#78350f;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}

main{padding:16px;max-width:1500px;margin:0 auto}
h2{margin:4px 0 12px;font-size:20px}
h3{margin:18px 0 8px;font-size:15px;color:var(--brand)}

/* ---------- generic ---------- */
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-weight:600}
.btn:hover{border-color:#cbd5e1;background:var(--soft)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:#fff;border-color:#fecaca;color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:12px}
.panel{background:var(--panel);border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:700;color:#fff;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-weight:600}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea,.inp{border:1px solid #cbd5e1;border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink);font-weight:400;font-size:14px;width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #93c5fd;outline-offset:0;border-color:#60a5fa}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.span2{grid-column:span 2}
.span3{grid-column:1/-1}
@media (max-width:700px){.top{gap:8px}.nav{order:5;flex-basis:100%}.brand{flex:1}}
@media (max-width:700px){.grid2,.grid3{grid-template-columns:1fr}.span2{grid-column:auto}}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;border-left:4px solid var(--brand2)}
.kpi b{display:block;font-size:24px;line-height:1.1}
.kpi span{color:var(--muted);font-size:12px;font-weight:600}
.kpi.red{border-color:var(--danger)} .kpi.red b{color:var(--danger)}
.kpi.orange{border-color:var(--warn)} .kpi.green{border-color:var(--ok)}

/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{background:#fff;border-radius:10px;box-shadow:var(--sh);padding:10px 12px;cursor:pointer;border-left:4px solid #cbd5e1;transition:transform .08s}
.card:hover{transform:translateY(-1px)}
.card .t{display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:11.5px;color:var(--muted)}
.card .n{font-weight:700;font-size:14.5px;margin-top:3px}
.card .s{font-size:12.5px;color:var(--muted)}
.card .m{font-size:12.5px;margin-top:4px}
.card .f{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:12px;color:var(--muted)}
.due{font-weight:600}
.due.late{color:var(--danger)} .due.today{color:var(--warn)}
.prio{width:8px;height:8px;border-radius:50%;display:inline-block}
.empty{color:var(--muted);padding:14px;text-align:center;background:#fff;border-radius:10px;border:1px dashed var(--line)}
.sec-h{display:flex;align-items:center;gap:8px;margin:18px 0 8px}
.sec-h h3{margin:0}
.count{background:var(--line);border-radius:99px;padding:0 8px;font-size:12px;font-weight:700}

/* ---------- board ---------- */
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{background:#e9edf3;border-radius:12px;min-width:270px;width:270px;flex:0 0 auto;padding:8px;max-height:calc(100vh - 170px);display:flex;flex-direction:column}
.col h4{margin:2px 4px 8px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.col .list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:60px;padding:2px}
.col.drop{outline:2px dashed var(--brand2)}
.col .tot{font-size:11.5px;color:var(--muted);margin:-4px 4px 6px}

/* ---------- table ---------- */
.tbl-wrap{overflow-x:auto;background:#fff;border-radius:var(--r);box-shadow:var(--sh)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--soft);text-align:left;padding:8px 10px;font-size:12px;color:var(--muted);position:sticky;top:0;white-space:nowrap}
.tbl td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:#f1f6fd}
.num{text-align:right;white-space:nowrap}

/* ---------- drawer & modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:24px 12px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:1100px}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{margin:0;font-size:17px;flex:1}
.modal-b{padding:16px 18px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;background:var(--soft);border-radius:0 0 14px 14px}
.x{border:0;background:transparent;font-size:22px;line-height:1;color:var(--muted);padding:4px 8px}
.drawer-ov{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:41;overflow-y:auto;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.drawer .dh{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;z-index:2}
.drawer .db{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.qa{display:flex;flex-wrap:wrap;gap:6px}
.qa a,.qa button{text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.steps{display:flex;flex-wrap:wrap;gap:4px}
.steps button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600}
.steps button.on{color:#fff}
dl.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;margin:0;font-size:13px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;word-break:break-word;white-space:pre-wrap}
.tl{list-style:none;margin:0;padding:0}
.tl li{border-left:2px solid var(--line);padding:0 0 10px 12px;position:relative;font-size:13px}
.tl li:before{content:"";position:absolute;left:-5px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--brand2)}
.tl .when{font-size:11.5px;color:var(--muted)}
.cot{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cot b{font-size:14px}

/* ---------- cotizador ---------- */
.items{width:100%;border-collapse:collapse}
.items th{font-size:11.5px;color:var(--muted);text-align:left;padding:4px}
.items td{padding:4px;vertical-align:top}
.items input,.items textarea,.items select{border:1px solid #cbd5e1;border-radius:7px;padding:6px 7px;width:100%;font-size:13px;background:#fff}
.items textarea{min-height:38px}
.tot-box{margin-left:auto;min-width:280px;background:var(--soft);border-radius:10px;padding:10px 14px;font-size:13.5px}
.tot-box div{display:flex;justify-content:space-between;gap:20px;padding:2px 0}
.tot-box .big{font-size:18px;font-weight:800;border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
@media (max-width:800px){
  .items thead{display:none}
  .items tr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;border-bottom:1px solid var(--line);padding:6px 0}
  .items td.wide{grid-column:1/-1}
}

/* ---------- charts ---------- */
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:150px 1fr 70px;gap:8px;align-items:center;font-size:12.5px}
.bar .track{background:#eef2f7;border-radius:6px;height:16px;overflow:hidden;position:relative}
.bar .fill{height:100%;background:var(--brand2);border-radius:6px}
.bar .fill2{position:absolute;left:0;top:0;height:100%;background:var(--ok);border-radius:6px}
.bar .v{text-align:right;font-weight:700}
.cols{display:flex;gap:8px;align-items:flex-end;height:170px;padding-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11.5px}
.cols .stack{width:100%;max-width:46px;background:#c7d7ee;border-radius:6px 6px 0 0;position:relative;display:flex;align-items:flex-end}
.cols .stack i{display:block;width:100%;background:var(--ok);border-radius:0 0 0 0}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
@media (max-width:500px){.bar{grid-template-columns:100px 1fr 50px}.mgrid{grid-template-columns:1fr}}

/* ---------- login / misc ---------- */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#1e3a5f,#2b5288)}
.login{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login h1{margin:0 0 4px;font-size:22px;color:var(--brand)}
.users{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.users button{padding:16px 10px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font-weight:700;font-size:15px}
.users button:hover{background:#e8f0fb;border-color:var(--brand2)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;z-index:100;box-shadow:var(--sh);max-width:90vw}
.toast.err{background:var(--danger)}
.busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:200;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:50% 100%;animation:ld 1s linear infinite}
@keyframes ld{from{background-position:-50% 0}to{background-position:150% 0}}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.filters .inp{width:auto;min-width:150px}
.switch{display:inline-flex;background:#e2e8f0;border-radius:99px;padding:3px}
.switch button{border:0;background:transparent;padding:5px 12px;border-radius:99px;font-weight:600;font-size:12.5px;color:var(--muted)}
.switch button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
</style>
</head>

o del peso mediante celda de carga.\nDispositivo apoya bolsas de altura ajustable.\nFácil desarme del sinfín para su limpieza.\nLógica por PLC con pantalla táctil de comunicación.\nProducción: hasta 4/5 bolsas por minuto, dependiendo del peso, tipo de producto a envasar y la precisión requerida.", "precio": 24900, "moneda": "USD", "iva": 10.5, "activo": "SI"}, {"codigo": "M-023", "nombre": "Embolsonadora de pan de miga", "descripcion": "Una máquina especialmente diseñada para el embolsado de panes de miga con colocación manual de la bolsa y sellado, compuesta de:\nCinta de entrada de 2000 mm de largo, con banda de pvc de 300 mm de ancho útil. Laterales ajustables y tapa superior de policarbonato compacto cristal. Accionamiento por motorreductor.\nEstructura autoportante con patas.\nTope registrable de llegada de producto.\nEmpujador neumático con registro para introducir el pan dentro de la bolsa.\nBoquillas retraíbles para el fijado de la bolsa de accionamiento neumático. Registro para ajustar al formato de la bolsa.\nMesa de salida para el producto terminado.\nMandíbulas de doble accionamiento con sellado por impulso. Alambre de corte para separar el exceso de la bolsa.\nSensores detectores de presencia de producto.\nLógica por plc con pantalla táctil para parametrización y alarmas.\nEstructuras y gabinetes construidos en acero al carbono, con proceso de pintura en polvo termoconvertible y horneado.\nFuncionamiento:\nEstando llena la cinta de alimentación, el operador coloca una bolsa en las boquillas.\nPresionando el pedal, las boquillas se expanden sujetando la bolsa a llenar.\nUn instante después, si el sensor detecta presencia del producto, el empujador introduce el pan dentro de la bolsa.\nSeguidamente las mandíbulas del sujetabolsas se retraen para permitir el cierre de la selladora.\nEl operador retira el producto de la mesa de salida y coloca una bolsa nueva para repetir el proceso.", "precio": 21000, "moneda": "USD", "iva": 10.5, "activo": "SI"}, {"codigo": "M-024", "nombre": "Envasadora SPGV", "descripcion": "Una ENVASADORA AUTOMÁTICA PARA SOLUCIONES PARENTERALES DE GRAN VOLUMEN (SPGV), que se describe a continuación:\nLa envasadora utiliza en su conformación un sistema rotativo de 4 estaciones, lo que permite la simultaneidad de las operaciones. En disposición de cada uno de sus 4 lados están ubicadas las estaciones que desempeñan las funciones requeridas: carga de envases, corte de cabeza para apertura, llenado, colocación y sellado de la tapa y expulsión.\nLos envases son procesados simultáneamente en 4 grupos de 4 unidades cada uno.\nSe dispone de un carrusel de 4 lados, accionado por motor paso a paso, con detención en cada estación.\nSe prevé una estructura tubular con cerramientos en policarbonato compacto cristal en sus laterales, dejando abierta su parte superior para facilitar la colocación de un flujo laminar no incluido en la presente cotización.\nEstación de carga de envases.\nEn esta estación, puesto del primer operador, se realiza la carga manual de los envases vacíos (4 envases), los que son sujetados por respectivas pinzas, tomándolos del cuello, en la ranura prevista para esta función.\nEstación de apertura del envase vacío y alimentación de las tapas.\nLuego de un giro de 90º del carrusel, los envases se posicionan en la segunda estación donde se dispone de un conjunto de 4 cuchillas en forma de punta aguda, que ingresan accionadas por cilindro neumático, produciendo el corte de las cabezas de los envases.\nUn colector recibe los cortes de las cabezas de los envases, ayudado por barrido de aire.\nAl mismo tiempo, en esta estación, se disponen de 4 toboganes para la alimentación manual de las tapas con una capacidad de 30 unidades cada uno, donde se dispone el segundo operador.\n(Consultar opción de alimentador automático de tapas) Estación de llenado.\nLuego de un giro de 90º del carrusel, los envases abiertos se posicionan en la tercera estación. Un conjunto de 4 agujas desciende hasta el interior de los envases, comenzando el proceso de llenado.\nLa dosificación de la solución se realiza por sistema isobárico o de presión constante, por lo que la misma debe llegar a la máquina con una cierta presión, la que debe mantenerse constante durante la operación.\nPara esto se dispone de una salida por relé libre de tensión para comandar una bomba centrífuga (no incluida).\nLa solución ingresa a un manifold distribuidor, donde toman 4 mangueras de silicona curadas, grado farmacéutico.\nEstas mangueras pasan por la válvula de corte, una cuchilla accionada por cilindro neumático que actúa por estrangulamiento. De ahí se dirigen a las agujas dosificadoras, las que están montadas sobre un cuadro que efectúa el descenso de las mismas, accionado por cilindro neumático.\nSe integra una bandeja colectora antigoteo.\nEstación de colocación de la tapa, sellado de la misma y expulsión del envase terminado.\nLuego de un giro de 90º del carrusel, los envases llenos se posicionan en la cuarta estación.\nEn esta estación, un brazo mediante 4 boquillas, y utilizando técnicas de vacío, toma las tapas de los toboganes y las posiciona alineadas con los envases llenos.\nUn calefactor produce, por radiación, la termofusión superficial del material del borde inferior de la tapa y de la superficie superior de la boca del envase.\nSeguidamente, y luego de la retracción del calefactor, descienden las boquillas con las tapas, suministrando la presión necesaria para producir la unión tapa-envase en forma segura.\nUna corriente de aire se proyecta sobre el perímetro de la tapa y el envase para acelerar el enfriamiento de la soldadura.\nFinalmente se produce la expulsión de los envases, los que son guiados fuera de la máquina por un tobogán. Todos los movimientos y desplazamientos descriptos en el párrafo anterior, son producidos mediante cilindros neumáticos.\nEl carrusel es movido por un motor paso a paso, y un freno de accionamiento neumático asegura se mantenga fijo en cada posición.\nEl funcionamiento lógico está regido por PLC, con pantalla como interface operador-máquina, cumpliendo las funciones de parametrización y displayado de alarmas.\nLa envasadora tiene una producción estimada en 1400 envases/hora, dependiendo de la soldabilidad de envases y tapas y de la temperatura de la solución. El envase a utilizar es del tipo cerrado de polipropileno, al igual que la tapa de doble vía.\nTodas las partes estructurales y accionamientos están construidos en acero inoxidable AISI 304. Las partes en contacto directo con el producto, tales como agujas y distribuidor están construidas en acero inoxidable AISI 316.", "precio": 140450, "moneda": "USD", "iva": 10.5, "activo": "SI"}, {"codigo": "M-046", "nombre": "Junior 2 balanzas", "descripcion": "Una MAQUINA ENVASADORA VERTICAL AUTOMATICA modelo JUNIOR EVS3, equipada con dosificador gravimétrico de dos balanzas, especialmente adecuada para productos irregulares no homogéneos.\nDosificador compuesto de tolva de recepción del producto, carga al pesaje por vibradores electromagnéticos grueso y fino controlados en velocidad.\nProcesamiento de las señales de peso mediante placa digital de alta velocidad, especialmente diseñada para pesaje dinámico y comunicación con el PLC de la envasadora. Sensores de peso por celda de carga.\nClapeta de obturación del canal grueso. Tolva de pesaje con descarga accionada neumáticamente. Embudo colector de descargas.\nConfecciona envases de 3 costuras tipo almohada en tamaño máximo 180x260 mm, a partir de lámina de material termosoldable en bobina.\nMordazas de temperatura constante controladas mediante pirómetro electrónico.\nArrastre de lámina por rodillos controlados con motores paso a paso con sus respectivos drivers.\nAccionamientos de mordazas mediante cilindros neumáticos.\nFotocentrado del envase.\nControl central mediante PLC. Panel electrónico touch screen de comunicación, parametrización, señalización y alarmas.\nPartes en contacto con el producto construidas en acero const isOpen = c => ABIERTOS.includes(c.estado);
const cfg = k => S.db.config[k] || '';
const cfgList = k => cfg(k).split(',').map(s=>s.trim()).filter(Boolean);
function waNum(t){let d=String(t||'').replace(/\D/g,''); if(!d) return ''; if(d.startsWith('00')) d=d.slice(2); if(d.startsWith('54')) return d; d=d.replace(/^0/,''); return '549'+d;}
function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),err?5000:2600)}
let busyN=0; function busy(on){busyN+=on?1:-1; $('#busy').classList.toggle('hidden',busyN<=0)}

function calLeyenda(){const o={}; cfg('CALIFICACIONES').split(';').forEach(x=>{const [k,v]=x.split('='); if(k&&v) o[k.trim()]=v.trim();}); return o;}
function planDe(cal){
  const k=String(cal||'2'); let out=[];
  cfg('PLAN_SEGUIMIENTO').split(';').forEach(x=>{const i=x.indexOf('='); if(i<0) return; if(x.slice(0,i).trim()!==k) return;
    out=x.slice(i+1).split('|').map(st=>{const j=st.indexOf(':'); return j<0?null:{d:Number(st.slice(0,j)),a:st.slice(j+1).trim()}}).filter(Boolean);});
  return out;
}
function primerPaso(c){ const p=planDe(c.calificacion); return p.length?{paso:0,fecha:addDays(hoy(),p[0].d),accion:p[0].a}:{paso:0,fecha:'',accion:''}; }
function sigPaso(c){
  const p=planDe(c.calificacion), n=Number(c.seg_paso||0)+1;
  if(c.fecha_envio && p[n]){ let f=addDays(d10(c.fecha_envio),p[n].d); if(f<=hoy()) f=addDays(hoy(),1); return {paso:n,fecha:f,accion:p[n].a,plan:true}; }
  return {paso:n,fecha:addDays(hoy(),Number(cfg('DIAS_SEGUIMIENTO'))||3),accion:'Seguimiento',plan:false};
}
function venc(c){return isOpen(c) && c.proxima_fecha && d10(c.proxima_fecha) < hoy()}
function esHoy(c){return isOpen(c) && d10(c.proxima_fecha) === hoy()}
function sinContacto(c){
  if(!['Cotizada','En seguimiento','Negociación'].includes(c.estado)) return false;
  const ref = c.ultimo_contacto || c.fecha;
  return diffDays(ref, hoy()) > (Number(cfg('DIAS_ALERTA_SIN_CONTACTO'))||7);
}
const cotsDe = id => S.db.cotizaciones.filter(x=>x.consulta_id===id).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
const mine = c => !S.soloMias || c.asignado===S.user;
function upsert(list,obj,key='id'){const i=list.findIndex(x=>x[key]===obj[key]); if(i>=0) list[i]=obj; else list.push(obj)}

/* =============================== API ================================ */
async function api(action,data={}){
  if(S.demo) return Demo.run(action, JSON.parse(JSON.stringify(data)));
  const r = await fetch(S.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,key:S.key,data})});
  const j = await r.json();
  if(j.moved && j.moved!==S.url && !api._saltos){   // el sistema se mudó de Drive: reconexión automática
    S.url=j.moved; LS.set('url_movida',j.moved); LS.set('url',j.moved);
    api._saltos=1; try{ return await api(action,data); } finally{ api._saltos=0; }
  }
  if(!j.ok) throw new Error(j.error||'Error del servidor');
  return j.data;
}
async function call(action,data,okMsg){
  busy(true);
  try{ const r = await api(action,Object.assign({usuario:S.user},data||{})); if(okMsg) toast(okMsg); return r; }
  catch(e){ toast('⚠ '+e.message,true); throw e; }
  finally{ busy(false); }
}
async function cargar(silent){
  if(!silent) busy(true);
  try{
    const d = await api('bootstrap');
    S.db = d;
    if(!S.logo){ api('getLogo').then(l=>{ if(l){S.logo=l; renderTop();} }).catch(()=>{}); }
    return true;
  }catch(e){ if(!silent) toast('⚠ '+e.message,true); return false; }
  finally{ if(!silent) busy(false); }
}

/* ============================== INICIO ============================== */
async function init(){
  // Link de acceso directo: .../#k=CLAVE (y opcional &u=URL_EXEC). Se guarda y se borra de la barra de direcciones.
  try{
    const h=new URLSearchParams(location.hash.slice(1));
    if(h.get('k')){ LS.set('key',h.get('k')); LS.set('demo',false); if(h.get('u')) LS.set('url',h.get('u')); history.replaceState(null,'',location.pathname+location.search); }
  }catch(e){}
  S.url = LS.get('url_movida','') || API_URL_FIJA || LS.get('url','');
  S.key = LS.get('key','');
  S.demo = LS.get('demo',false);
  S.user = LS.get('user','');
  S.soloMias = LS.get('soloMias',true);
  S.view = LS.get('view','hoy');
  if(!S.demo && (!S.url || !S.key)) return renderLogin();
  const ok = await cargar();
  if(!ok){ return renderLogin(); }
  if(!S.user || !S.db.usuarios.some(u=>u.nombre===S.user)) return renderUserPick();
  renderApp();
}

/* ============================== TARJETA ============================= */
function card(c,drag){
  const late = venc(c), today = esHoy(c);
  const cots = cotsDe(c.id);
  const due = c.proxima_fecha && isOpen(c)
    ? `<span class="due ${late?'late':today?'today':''}">📅 ${late?'Vencido ':''}${today?'HOY':fd(c.proxima_fecha)} · ${esc(c.proxima_accion||'Seguimiento')}</span>` : '';
  return `<div class="card" ${drag?`draggable="true" ondragstart="dragStart(event,'${c.id}')"`:''} onclick="abrirConsulta('${c.id}')" style="border-left-color:${EST_COLOR[c.estado]}">
    <div class="t"><span>${c.calificacion?`<span class="prio" title="Calificación ${esc(c.calificacion)}" style="background:${CAL_COLOR[c.calificacion]||'#cbd5e1'}"></span> <b style="color:${CAL_COLOR[c.calificacion]}">${esc(c.calificacion)}</b> ·`:''} ${c.id} · ${CANAL_ICO[c.canal]||''} ${esc(c.canal||'')}</span><span class="pill" style="background:${EST_COLOR[c.estado]}">${esc(c.estado)}</span></div>
    <div class="n">${esc(nombreDe(c))}${String(c.es_cliente).toUpperCase()==='SI'?' <span title="Ya es cliente" style="color:#d97706">⭐</span>':''}</div>
    <div class="s">${esc([c.empresa?c.contacto:'',c.localidad].filter(Boolean).join(' · '))}</div>
    ${c.maquina?`<div class="m">⚙️ ${esc(c.maquina)}</div>`:''}
    <div class="f">${due}${c.asignado?`<span>👤 ${esc(c.asignado)}</span>`:'<span style="color:var(--danger);font-weight:700">Sin asignar</span>'}
      ${num(c.monto_estimado)?`<span>💲 ${moneyK(c.monto_estimado,c.moneda)}</span>`:''}${cots.length?`<span>📄 ${cots.length}</span>`:''}
      ${sinContacto(c)?'<span style="color:var(--danger)">⚠ sin contacto '+diffDays(c.ultimo_contacto||c.fecha,hoy())+'d</span>':''}</div>
  </div>`;
}
const cardsOr = (arr,msg) => arr.length ? `<div class="cards">${arr.map(c=>card(c)).join('')}</div>` : `<div class="empty">${msg}</div>`;
const byDue = (a,b) => String(d10(a.proxima_fecha)||'9').localeCompare(String(d10(b.proxima_fecha)||'9'));

function filtrarLista(){
  const f=S.f, q=f.q.toLowerCase();
  return S.db.consultas.filter(c=>{
    if(f.estado==='abiertas' && !isOpen(c)) return false;
    if(f.estado && f.estado!=='abiertas' && c.estado!==f.estado) return false;
    if(f.asignado && c.asignado!==f.asignado) return false;
    if(f.canal && c.canal!==f.canal) return false;
    if(q && ![c.id,c.contacto,c.empresa,c.maquina,c.localidad,c.telefono,c.email,c.detalle].join(' ').toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
}

/* =============================== MÉTRICAS =========================== */
function hbars(rows,opt={}){
  const max=Math.max(1,...rows.map(r=>r.v));
  if(!rows.length) return '<div class="muted small">Sin datos en el período</div>';
  return `<div class="bars">${rows.map(r=>`<div class="bar"><span title="${esc(r.l)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.l)}</span>
    <div class="track"><div class="fill" style="width:${r.v/max*100}%"></div>${r.g!=null?`<div class="fill2" style="width:${r.g/max*100}%"></div>`:''}</div>
    <span class="v">${opt.fmt?opt.fmt(r):r.v}</span></div>`).join('')}</div>`;
}
function viewMetricas(m){
  const N=S.metMeses; const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-(N-1)); const desde=isoOf(d);
  const cs=S.db.consultas.filter(c=>d10(c.fecha)>=desde);
  const cotIds=new Set(S.db.cotizaciones.map(x=>x.consulta_id));
  const cotizadas=cs.filter(c=>cotIds.has(c.id));
  const gan=cs.filter(c=>c.estado==='Ganada'), per=cs.filter(c=>c.estado==='Perdida');
  const tasaCierre = gan.length+per.length ? Math.round(gan.length/(gan.length+per.length)*100) : 0;
  const tasaGlobal = cs.length ? Math.round(gan.length/cs.length*100) : 0;
  const ganM={}; gan.forEach(c=>{const k=c.moneda||'USD'; ganM[k]=(ganM[k]||0)+num(c.monto_final||c.monto_estimado)});
  const pipe={}; S.db.consultas.filter(isOpen).forEach(c=>{ if(num(c.monto_estimado)){const k=c.moneda||'USD'; pipe[k]=(pipe[k]||0)+num(c.monto_estimado)} });
  // tiempo hasta 1ª cotización
  const tiempos=cotizadas.map(c=>{const f=S.db.cotizaciones.filter(x=>x.consulta_id===c.id).map(x=>d10(x.fecha)).sort()[0]; return Math.max(0,diffDays(c.fecha,f));});
  const tProm = tiempos.length ? (tiempos.reduce((a,b)=>a+b,0)/tiempos.length).toFixed(1) : '—';
  // por mes
  const meses=[]; for(let i=0;i<N;i++){const x=new Date(d.getFullYear(),d.getMonth()+i,1); meses.push(isoOf(x).slice(0,7));}
  const MES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

  const maxM=Math.max(1,...pm.map(x=>x.t));
  const group=(arr,fn)=>{const o={}; arr.forEach(c=>{const k=fn(c)||'(sin dato)'; o[k]=(o[k]||0)+1}); return Object.entries(o).map(([l,v])=>({l,v})).sort((a,b)=>b.v-a.v)};

  const porCanal=CANALES.map(k=>{const mi=cs.filter(c=>c.canal===k); return {l:k,v:mi.length,g:mi.filter(c=>c.estado==='Ganada').length}}).filter(r=>r.v).sort((a,b)=>b.v-a.v);
  m.innerHTML = `<div class="row" style="margin-bottom:10px"><h2 class="grow" style="margin:0">Métricas de ventas</h2>
    <div class="switch">${[3,6,12].map(n=>`<button class="${N===n?'on':''}" onclick="S.metMeses=${n};render()">${n} meses</button>`).join('')}</div></div>
    <div class="kpis">
      <div class="kpi"><b>${cs.length}</b><span>Consultas recibidas</span></div>
      <div class="kpi"><b>${cs.length?Math.round(cotizadas.length/cs.length*100):0}%</b><span>Cotizadas (${cotizadas.length})</span></div>
      <div class="kpi orange"><b>${tProm}${tProm!=='—'?' d':''}</b><span>Días promedio hasta cotizar</span></div>
      <div class="kpi green"><b>${gan.length}</b><span>Ganadas · ${tasaGlobal}% del total</span></div>
      <div class="kpi green"><b>${tasaCierre}%</b><span>Tasa de cierre (ganadas / cerradas)</span></div>
      <div class="kpi green"><b style="font-size:16px">${Object.keys(ganM).map(k=>moneyK(ganM[k],k)).join('<br>')||'—'}</b><span>Vendido en el período</span></div>
      <div class="kpi"><b style="font-size:16px">${Object.keys(pipe).map(k=>moneyK(pipe[k],k)).join('<br>')||'—'}</b><span>En juego hoy (abiertas)</span></div>
    </div>
    <div class="mgrid">
      <div class="panel"><h3 style="margin-top:0">Consultas por mes</h3>
        <div class="cols">${pm.map(x=>`<div class="c"><b>${x.t}</b><div class="stack" style="height:${x.t/maxM*120+2}px">${x.g?`<i style="height:${x.g/Math.max(x.t,1)*100}%"></i>`:''}</div><span>${MES[Number(x.k.slice(5))-1]}</span></div>`).join('')}</div>
        <div class="legend"><span style="--c:#c7d7ee">Consultas</span><span style="--c:var(--ok)">Ganadas</span></div></div>
      <div class="panel"><h3 style="margin-top:0">Por responsable <span class="muted small">(cotizadas / consultas · verde = ganadas)</span></h3>${hbars(porResp,{fmt:r=>r.cot+'/'+r.v})}</div>
      <div class="panel"><h3 style="margin-top:0">Por canal de ingreso</h3>${hbars(porCanal)}</div>
      <div class="panel"><h3 style="margin-top:0">¿Por qué perdemos?</h3>${hbars(group(per,c=>c.motivo_perdida))}</div>
      <div class="panel"><h3 style="margin-top:0">Máquinas más consultadas</h3>${hbars(group(cs.filter(c=>c.maquina),c=>c.maquina).slice(0,8))}</div>
      <div class="panel"><h3 style="margin-top:0">Por calificación <span class="muted small">(verde = ganadas)</span></h3>${hbars(['1','2','3','4','5'].map(k=>{const mi=cs.filter(c=>String(c.calificacion)===k); return {l:k+' · '+(calLeyenda()[k]||'').split('.').pop().trim().slice(0,28),v:mi.length,g:mi.filter(c=>c.estado==='Ganada').length}}).filter(r=>r.v))}</div>
      <div class="panel"><h3 style="margin-top:0">Embudo actual</h3>${hbars(ESTADOS.map(e=>({l:e,v:cs.filter(c=>c.estado===e).length})))}</div>
    </div>`;
}

function fcSet(k,v){ FC[k]=v; document.querySelectorAll('#ch_'+k+' .chip').forEach(b=>b.classList.toggle('on', b.textContent.trim().endsWith(v||'Sin asignar') && (v!==''||b.textContent.trim()==='Sin asignar'))); }
function autoEmpresa(){
  const e=$('#cEmp').value.trim(); if(!e) return;
  const prev=S.db.consultas.filter(c=>c.empresa===e).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)))[0];
  if(!prev) return;
  [['#cCon','contacto'],['#cTel','telefono'],['#cMail','email'],['#cLoc','localidad'],['#cCuit','cuit']].forEach(([s,k])=>{ if(!$(s).value) $(s).value=prev[k]||''; });
  if(prev.provincia) $('#cProv').value=prev.provincia;
  if(S.db.consultas.some(c=>c.empresa===e && (String(c.es_cliente).toUpperCase()==='SI'||c.estado==='Ganada'))) $('#cCli').checked=true;
  toast('Cliente conocido: datos completados ('+prev.id+')');
}
async function guardarConsulta(cotizar,id){
  const d={canal:FC.canal,prioridad:FC.prioridad,asignado:FC.asignado,calificacion:FC.calificacion,es_cliente:$('#cCli').checked?'SI':'',empresa:$('#cEmp').value.trim(),contacto:$('#cCon').value.trim(),telefono:$('#cTel').value.trim(),email:$('#cMail').value.trim(),
    localidad:$('#cLoc').value.trim(),provincia:$('#cProv').value,maquina:$('#cMaq').value.trim(),detalle:$('#cDet').value.trim(),cuit:$('#cCuit').value.trim(),origen:$('#cOri').value};
  if(!d.contacto && !d.empresa) return toast('Poné al menos el nombre del contacto o la empresa',true);
  if(!d.telefono && !d.email) { if(!confirm('No cargaste teléfono ni email. ¿Guardar igual?')) return; }
  if(id) d.id=id;
  if(cotizar && !d.asignado) d.asignado=S.user;
  const c = await call('saveConsulta',d,id?'Cambios guardados':'Consulta '+(id||'')+' registrada ✔');
  upsert(S.db.consultas,c); cerrarModal(); refreshAll();
  if(!id && !cotizar) toast('Consulta '+c.id+' registrada ✔');
  if(c.calificacion==='5' && isOpen(c) && confirm('Calificación 5 (no responder). ¿Cerrarla como "No califica"?')){
    const r=await call('cambiarEstado',{id:c.id,estado:'Perdida',motivo_perdida:cfgList('MOTIVOS_PERDIDA')[0]||'No califica'},'Cerrada como no califica');
    upsert(S.db.consultas,r); refreshAll(); return;
  }
  if(cotizar) cotizador(c.id); else if(!id) abrirConsulta(c.id);
}

function totales(items){
  let lista=0,neto=0; const ivas={};
  items.forEach(it=>{ const p=num(it.precio), b=precioBon(it); lista+=p; neto+=b; const k=String(num(it.iva)); ivas[k]=(ivas[k]||0)+b*num(it.iva)/100; });
  const r2=n=>Math.round(n*100)/100, iva=Object.values(ivas).reduce((a,b)=>a+b,0);
  return {lista:r2(lista),descuento:r2(lista-neto),neto:r2(neto),ivas,iva:r2(iva),conIva:r2(neto+iva)};
}

let PDF_FONT='Roboto', fontsOK=null;
async function prepararFuentes(){
  if(fontsOK!==null) return;
  fontsOK=false;
  if(!/^https?:/.test(location.protocol)) return; // abierto como archivo local: usa Roboto
  const base=new URL('fonts/',location.href).href;
  try{
    const r=await fetch(base+'LiberationSans-Regular.ttf',{method:'HEAD'}); if(!r.ok) return;
    pdfMake.fonts={Roboto:{normal:'Roboto-Regular.ttf',bold:'Roboto-Medium.ttf',italics:'Roboto-Italic.ttf',bolditalics:'Roboto-MediumItalic.ttf'},
      Arial:{normal:base+'LiberationSans-Regular.ttf',bold:base+'LiberationSans-Bold.ttf',italics:base+'LiberationSans-Italic.ttf',bolditalics:base+'LiberationSans-BoldItalic.ttf'}};
    PDF_FONT='Arial'; fontsOK=true;
  }catch(e){}
}
async function pdfBlob(def){
  if(!window.pdfMake) throw new Error('no cargó pdfmake');
  await prepararFuentes(); def.defaultStyle.font=PDF_FONT;
  try{ return await new Promise((res,rej)=>{ try{ pdfMake.createPdf(def).getBlob(res); }catch(e){rej(e)} setTimeout(()=>rej(new Error('timeout')),20000); }); }
  catch(e){ if(PDF_FONT==='Roboto') throw e; PDF_FONT='Roboto'; def.defaultStyle.font='Roboto'; return await new Promise(res=>pdfMake.createPdf(def).getBlob(res)); }
}
function verPDF(cotId){
  const x=S.db.cotizaciones.find(y=>y.id===cotId);
  if(x.pdf_url) window.open(x.pdf_url,'_blank');
  else if(x._fileUrl){ fetch(x._fileUrl).then(r=>r.blob()).then(b=>descargarBlob(b,x.id+' '+((()=>{try{return JSON.parse(x.extras_json||'{}').titulo||''}catch(e){return ''}})()))).catch(()=>window.open(x._fileUrl,'_blank')); }
  else toast('Esta cotización no tiene archivo (usá 📎 Adjuntar)',true);
}

    const est=['Nueva','En cotización','Cotizada','En seguimiento','Negociación','Ganada','Perdida','Perdida','Perdida','Cotizada','En seguimiento'];
    const mot=cfgDef.MOTIVOS_PERDIDA.split(',');
    for(let i=0;i<34;i++){
      const ago=Math.floor(rnd()*160), f=addDays(hoy(),-ago), e=emp[Math.floor(rnd()*emp.length)], p=prods.filter(x=>x.codigo.startsWith('M-')&&x.moneda==='USD')[Math.floor(rnd()*30)];
      let estado = ago<4 ? (rnd()<.6?'Nueva':'En cotización') : est[Math.floor(rnd()*est.length)];
      const id='CON-'+f.slice(2,4)+'-'+String(i+1).padStart(4,'0');
      const c={id,fecha:f+'T'+pad(8+Math.floor(rnd()*9))+':'+pad(Math.floor(rnd()*60))+':00',canal:CANALES[Math.floor(rnd()*4)],contacto:e[1],empresa:e[0],telefono:'341'+Math.floor(4000000+rnd()*999999),email:e[1].split(' ')[0].toLowerCase()+'@ejemplo.com',
        localidad:e[2],provincia:e[3],maquina:p.nombre,detalle:'Necesita envasar '+['harina','yerba','snacks','especias','arroz','café'][Math.floor(rnd()*6)]+' en bolsas de '+[250,500,1000][Math.floor(rnd()*3)]+' g. Producción estimada '+(10+Math.floor(rnd()*30))+' bolsas/min.',
        origen:cfgDef.ORIGENES.split(',')[Math.floor(rnd()*6)],asignado:estado==='Nueva'&&rnd()<.5?'':U[Math.floor(rnd()*3)],prioridad:'Media',calificacion:String(1+Math.floor(rnd()*4)),es_cliente:rnd()<.15?'SI':'',estado,
        proxima_accion:'',proxima_fecha:'',monto_estimado:'',moneda:'USD',motivo_perdida:'',monto_final:'',fecha_cierre:'',creado_por:U[Math.floor(rnd()*3)],ultimo_contacto:''};
      if(!['Nueva','En cotización'].includes(estado)){
        const cf=addDays(f,1+Math.floor(rnd()*6));
        const items=[{codigo:p.codigo,nombre:p.nombre,descripcion:p.descripcion,cantidad:1,precio:p.precio,bonif:rnd()<.5?20:0,iva:p.iva}];
        const t=totales(items); const num_='0'+cf.slice(2,4)+'-'+String(cotizaciones.length+1).padStart(4,'0');
        cotizaciones.push({id:num_,consulta_id:id,numero:num_,revision:0,fecha:cf+'T10:00:00',moneda:'USD',subtotal:t.lista,descuento:t.descuento,iva:t.iva,total:t.neto,extras_json:JSON.stringify({titulo:p.nombre,cuotas:6,mostrar_cuota:true,incluir_fin:true}),condiciones_pago:DEF.COND_PAGO,plazo_entrega:DEF.PLAZO_ENTREGA,validez_dias:15,garantia:DEF.GARANTIA,lugar_entrega:DEF.LUGAR_ENTREGA,notas:'',items_json:JSON.stringify(items),pdf_url:'',enviada_fecha:cf+'T11:00:00',enviada_a:c.email,creado_por:c.asignado});
        c.monto_estimado=t.neto; c.ultimo_contacto=addDays(cf,Math.floor(rnd()*5)); c.fecha_envio=cf; c.seg_paso=Math.floor(rnd()*2);
      }
      if(isOpen(c)){ c.proxima_fecha=addDays(hoy(),Math.floor(rnd()*12)-5); c.proxima_accion=estado==='Nueva'?'Responder / cotizar':'Seguimiento de cotización'; }
      if(estado==='Ganada'){ c.fecha_cierre=addDays(f,10+Math.floor(rnd()*20)); if(c.fecha_cierre>hoy()) c.fecha_cierre=hoy(); c.monto_final=c.monto_estimado; }
      if(estado==='Perdida'){ c.fecha_cierre=addDays(f,15); if(c.fecha_cierre>hoy()) c.fecha_cierre=hoy(); c.motivo_perdida=mot[Math.floor(rnd()*mot.length)]; }
      consultas.push(c); hist.push({fecha:c.fecha,consulta_id:id,usuario:c.creado_por,tipo:'alta',detalle:'Consulta creada ('+c.canal+')'});
    }
    return {config:cfgDef,usuarios:U.map(n=>({nombre:n,email:'',rol:'',activo:'SI',firma:n==='David Soldani'?'Ing. David Soldani':n})),productos:prods,consultas,cotizaciones};
  }
  function load(){ if(db) return; const s=LS.get('demo_db',null); if(s){db=s.db;hist=s.hist||[]} else { db=seed(); save(); } }
  function save(){ LS.set('demo_db',{db,hist}); }
  const now=()=>{const d=new Date(); return isoOf(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())};
  const log=(id,u,tipo,det)=>hist.push({fecha:now(),consulta_id:id,usuario:u,tipo,detalle:det});
  const next=(list,prefix,field)=>{const yy=hoy().slice(2,4); const re=new RegExp('^'+prefix+'-'+yy+'-(\\d+)'); const mx=list.reduce((m,r)=>{const x=String(r[field]).match(re); return x?Math.max(m,+x[1]):m},0); return prefix+'-'+yy+'-'+String(mx+1).padStart(4,'0')};
  const get=id=>db.consultas.find(c=>c.id===id);
  const H={
    bootstrap:()=>JSON.parse(JSON.stringify(Object.assign({},db,{hoy:hoy()}))),
    getLogo:()=>'',
    saveConsulta:d=>{
      const u=d.usuario; delete d.usuario;
      if(!d.id){ const c=Object.assign({estado:'Nueva',prioridad:'Media',moneda:'USD'},d,{id:next(db.consultas,'CON','id'),fecha:now(),creado_por:u,proxima_fecha:hoy(),proxima_accion:'Responder / cotizar'}); db.consultas.push(c); log(c.id,u,'alta','Consulta creada ('+c.canal+')'+(c.asignado?' · asignada a '+c.asignado:'')); return c; }
      const c=get(d.id);
      if(d.asignado!==undefined && d.asignado!==c.asignado) log(c.id,u,'asignacion','Asignada a '+(d.asignado||'—'));
      if(d.proxima_fecha!==undefined && d.proxima_fecha!==c.proxima_fecha) log(c.id,u,'agenda','Próxima acción: '+(d.proxima_accion||'')+' → '+(d.proxima_fecha||'sin fecha'));
      Object.assign(c,d); return c;
    },
    cambiarEstado:d=>{
      const c=get(d.id), prev=c.estado; c.estado=d.estado;
      if(['Ganada','Perdida','Archivada'].includes(d.estado)){ c.fecha_cierre=hoy(); c.motivo_perdida=d.estado==='Perdida'?d.motivo_perdida:''; c.monto_final=d.monto_final||''; if(d.moneda) c.moneda=d.moneda; c.proxima_fecha=''; c.proxima_accion=''; } else c.fecha_cierre='';
      log(c.id,d.usuario,'estado',prev+' → '+d.estado+(d.motivo_perdida?' · Motivo: '+d.motivo_perdida:'')+(d.monto_final?' · Monto: '+(d.moneda||'')+' '+d.monto_final:'')+(d.nota?' · '+d.nota:'')); return c;
    },
    registrarContacto:d=>{
      const c=get(d.id); if(d.tipo!=='nota') c.ultimo_contacto=hoy();
      if(d.proxima_fecha!==undefined){c.proxima_fecha=d.proxima_fecha;c.proxima_accion=d.proxima_fecha?(d.proxima_accion||'Seguimiento'):''}
      if(d.seg_paso!==undefined) c.seg_paso=d.seg_paso;
      log(c.id,d.usuario,d.tipo,d.detalle);
      if(d.tipo!=='nota' && c.estado==='Cotizada'){ c.estado='En seguimiento'; log(c.id,d.usuario,'estado','Cotizada → En seguimiento'); }
      return c;
    },
    getHistorial:d=>hist.filter(h=>h.consulta_id===d.consulta_id).slice().reverse(),
    saveCotizacion:d=>{
      const c=get(d.consulta_id);
      const ex=d.id&&db.cotizaciones.find(x=>x.id===d.id);
      if(ex){ if(d._fileUrl) ex._fileUrl=d._fileUrl; if(!d.silencioso) log(c.id,d.usuario,'cotizacion','Archivo adjuntado a '+ex.id); return {cotizacion:ex,consulta:c}; } const cot=Object.assign({},d); delete cot.items; delete cot.html; delete cot.usuario; delete cot.revision_de;
      if(d.revision_de){ cot.numero=d.revision_de; cot.revision=db.cotizaciones.filter(x=>x.numero===d.revision_de).reduce((m,x)=>Math.max(m,+x.revision||0),0)+1; }
      else { const yy=hoy().slice(2,4), re=new RegExp('^0'+yy+'-(\\d{4})'); const mx=db.cotizaciones.reduce((m,r)=>{const x=String(r.numero).match(re); return x?Math.max(m,+x[1]):m},0); cot.numero='0'+yy+'-'+String(mx+1).padStart(4,'0'); cot.revision=0; }
      delete cot.file_b64; delete cot.file_name; delete cot.file_mime; delete cot._fileUrl; if(d._fileUrl) cot._fileUrl=d._fileUrl;
      cot.id=cot.numero+(cot.revision>0?'-R'+cot.revision:''); cot.fecha=now(); cot.creado_por=d.usuario; cot.items_json=JSON.stringify(d.items); cot.pdf_url='';
      db.cotizaciones.push(cot); c.monto_estimado=cot.total; c.moneda=cot.moneda; if(c.estado==='Nueva') c.estado='En cotización';
      log(c.id,d.usuario,'cotizacion','Cotización '+cot.id+' guardada · '+money(cot.total,cot.moneda)+' + IVA'); return {cotizacion:cot,consulta:c};
    },
    marcarEnviada:d=>{
      const cot=db.cotizaciones.find(x=>x.id===d.cotizacion_id); cot.enviada_fecha=now(); cot.enviada_a=d.para||d.medio;
      const c=get(cot.consulta_id); c.ultimo_contacto=hoy(); c.fecha_envio=hoy(); c.seg_paso=0;
      if(d.proxima_fecha!==undefined){ c.proxima_fecha=d.proxima_fecha; c.proxima_accion=d.proxima_accion||''; } else { c.proxima_fecha=addDays(hoy(),3); c.proxima_accion='Seguimiento de cotización '+cot.id; }
      if(['Nueva','En cotización'].includes(c.estado)) c.estado='Cotizada';
      log(c.id,d.usuario,d.medio==='whatsapp'?'whatsapp':'email','Cotización '+cot.id+' enviada por '+(d.medio||'email')+(d.para?' a '+d.para:'')); return {cotizacion:cot,consulta:c};
    },
    enviarCotizacion:d=>H.marcarEnviada(Object.assign(d,{medio:'email'})),
    saveProducto:d=>{ const i=db.productos.findIndex(p=>p.codigo===d.codigo); delete d.usuario; if(i>=0) db.productos[i]=Object.assign(db.productos[i],d); else db.productos.push(d); db.productos=db.productos.filter(p=>p.activo!=='NO'); return db.productos; }
  };
  return { run(action,data){ load(); if(!H[action]) return Promise.reject(new Error('Acción desconocida')); return new Promise(res=>setTimeout(()=>{ const r=H[action](data); save(); res(JSON.parse(JSON.stringify(r))); },120)); } };
})();

/* ============================ ATAJOS / SYNC ========================= */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if($('#modal')&&$('#modal').innerHTML) cerrarModal(); else if(S.open) cerrarDrawer(); }
  if(e.key==='n' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && $('#main') && !$('#modal').innerHTML){ e.preventDefault(); formConsulta(); }
});
// Sincroniza con el equipo cada 2 minutos (si no hay nada abierto)
setInterval(async()=>{ if(!$('#main')||S.demo||($('#modal')&&$('#modal').innerHTML)||S.open) return; if(await cargar(true)){ renderTop(); render(); } },120000);

init();
</script>
